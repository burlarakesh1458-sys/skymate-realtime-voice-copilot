[project]
name = "realtime-voice-assistant"
version = "1.0.0"
description = "Real-time voice assistant (browser mic -> WebSocket -> ASR -> streaming LLM -> streaming TTS) with per-turn latency budgets and production resilience."
authors = [{ name = "Rakesh Burla", email = "burlarakesh1458@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["models", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "SIM105", "UP007", "B023", "ASYNC110"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
